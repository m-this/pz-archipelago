name: Release

on:
  push:
    tags: ["v*"]

# No `make check`: the tag points at a commit CI already passed on main.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make version-check TAG="$GITHUB_REF_NAME"
      - run: make dist
      - name: checksum the assets
        run: cd dist && sha256sum pzap.exe planetzoo.apworld planetzoo-poptracker.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/pzap.exe
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            dist/pzap.exe dist/planetzoo.apworld dist/planetzoo-poptracker.zip dist/SHA256SUMS
      # A missing scan must not fail a release.
      - if: env.VT_API_KEY != ''
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          files: dist/pzap.exe
